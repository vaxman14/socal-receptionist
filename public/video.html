<!DOCTYPE html>

<head>

  <style>
    :root { --bg:#ffffff; --panel:#ffffff; --text:#0b1430; --muted:#5b6680; --accent:#ff5a36; --border:#e7eaf1; }
    * { box-sizing: border-box; }
    body {
      margin:0; min-height:100vh; background:var(--bg);
      color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      display:flex; flex-direction:column; align-items:center; padding:40px 20px 56px;
    }
    .logo { width:min(520px, 90%); height:auto; margin-bottom:30px; }
    h1 { font-size:1.6rem; font-weight:700; margin:0 0 8px; text-align:center; }
    p.sub { color:var(--muted); margin:0 0 30px; text-align:center; max-width:640px; line-height:1.55; }
    .frame {
      width:100%; max-width:940px; background:var(--panel); border:1px solid var(--border);
      border-radius:16px; overflow:hidden; box-shadow:0 20px 50px rgba(20,30,60,.12);
    }
    video { width:100%; display:block; background:#000; aspect-ratio:16/9; }
    .cta { margin-top:30px; display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
    .btn { text-decoration:none; padding:13px 24px; border-radius:999px; font-weight:600; font-size:.95rem; }
    .btn.primary { background:var(--accent); color:#fff; }
    .btn.ghost { border:1px solid var(--border); color:var(--text); }
    .foot { margin-top:36px; color:var(--muted); font-size:.85rem; text-align:center; }
    .foot a { color:var(--accent); text-decoration:none; }
  </style>
</head>
<body>
  <img class="logo" src="/images/logo-clean.png" alt="SoCal Receptionist" onerror="this.style.display='none'" />
  <h1>Watch SoCal Receptionist in action</h1>
  <p class="sub">An AI phone receptionist that answers every call 24/7, holds a natural conversation, captures leads, and books appointments.</p>

  <div class="frame">
    <video controls playsinline preload="metadata"
      src="https://fxjbxeckzeplixdgwbqk.supabase.co/storage/v1/object/public/demos/socal-receptionist-demo.mp4">
      Your browser does not support the video tag.

    </video>
  </div>

  <div class="cta">
    <a class="btn primary" href="tel:+19513958776">Call the live demo: (951) 395-8776</a>
    <a class="btn ghost" href="https://www.socalreceptionist.com">Visit website</a>
  </div>

  <div class="foot">SoCal Receptionist · <a href="https://www.socalreceptionist.com">socalreceptionist.com</a></div>
</body>
